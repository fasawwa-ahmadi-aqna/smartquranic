<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Management Grup Khatam</title>
  <link rel="shortcut icon" type="image/png" href="img/iconfazz.png">
  <!-- Tailwind CSS & SweetAlert2 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase Web SDK v10 (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, getDocs, updateDoc, deleteDoc, query, where, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Project
    const firebaseConfig = {
      apiKey: "AIzaSyCYlcSu9Nl1V_vWSkkh3qq8cYTouExdz08",
      authDomain: "fazz-smartquranic-4ff03.firebaseapp.com",
      projectId: "fazz-smartquranic-4ff03",
      storageBucket: "fazz-smartquranic-4ff03.firebasestorage.app",
      messagingSenderId: "227018342445",
      appId: "1:227018342445:web:f2f11c8623feabca4fb8a4",
      measurementId: "G-EV2MCX8DND"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreApi = { collection, doc, getDocs, updateDoc, deleteDoc, query, where, writeBatch };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Admin -->
    <header class="glass-dark rounded-3xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-indigo-500/20">
      <div>
        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400">
          ⚙️ Admin CRUD Dashboard
        </h1>
        <p class="text-xs text-slate-400 mt-1">Kelola, edit, dan bersihkan data grup Khatam di Firestore</p>
      </div>
      <button onclick="loadAllGroups()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition flex items-center gap-2">
        🔄 Refresh Data
      </button>
    </header>

    <!-- Tabel Daftar Grup -->
    <div class="glass-dark rounded-3xl p-6 border border-slate-800 overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="text-xs uppercase bg-slate-900/80 text-indigo-400 border-b border-slate-800">
          <tr>
            <th class="p-4">ID Grup</th>
            <th class="p-4">Nama Grup</th>
            <th class="p-4">Mode</th>
            <th class="p-4">Deadline</th>
            <th class="p-4">Progress Khatam</th>
            <th class="p-4 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableGroupsBody" class="divide-y divide-slate-800">
          <tr>
            <td colspan="6" class="p-4 text-center text-slate-500">Memuat data grup...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const showSwal = (icon, title, text) => {
      Swal.fire({
        icon, title, text,
        background: '#0f172a',
        color: '#f8fafc',
        confirmButtonColor: '#6366f1'
      });
    };

    window.onload = () => {
      setTimeout(loadAllGroups, 500);
    };

    // 1. READ: Ambil Semua Grup & Hitung Progressnya
    async function loadAllGroups() {
      if (!window.db) return;
      const { collection, getDocs, query, where } = window.firestoreApi;
      const tbody = document.getElementById('tableGroupsBody');
      tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Sedang mengambil data...</td></tr>`;

      try {
        const groupsSnap = await getDocs(collection(window.db, "aknend_groups"));
        if (groupsSnap.empty) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">Belum ada data grup.</td></tr>`;
          return;
        }

        let html = '';
        for (let groupDoc of groupsSnap.docs) {
          const g = groupDoc.data();
          
          // Hitung progress juz completed untuk grup ini
          const qJuz = query(collection(window.db, "juz_status"), where("group_id", "==", g.group_id));
          const juzSnap = await getDocs(qJuz);
          
          let completed = 0;
          juzSnap.forEach(j => { if (j.data().status === 'completed') completed++; });
          const percent = Math.round((completed / 30) * 100);

          html += `
            <tr class="hover:bg-slate-900/50 transition">
              <td class="p-4 font-mono font-bold text-indigo-400">${g.group_id}</td>
              <td class="p-4 font-semibold text-slate-100">${g.nama_grup}</td>
              <td class="p-4"><span class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">${g.assignment_mode}</span></td>
              <td class="p-4 text-xs text-slate-400">${g.deadline || '-'}</td>
              <td class="p-4">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold ${percent === 100 ? 'text-emerald-400' : 'text-slate-300'}">${completed}/30 (${percent}%)</span>
                  ${percent === 100 ? '<span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-bold">Khatam 🎉</span>' : ''}
                </div>
              </td>
              <td class="p-4 flex justify-center gap-2">
                <button onclick="editGrup('${g.group_id}', '${g.nama_grup}', '${g.deadline}')" class="px-3 py-1.5 bg-amber-600/20 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold hover:bg-amber-600/40">Edit</button>
                <button onclick="hapusGrupBesertaChild('${g.group_id}', '${g.nama_grup}')" class="px-3 py-1.5 bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold hover:bg-rose-600/40">Hapus</button>
              </td>
            </tr>
          `;
        }
        tbody.innerHTML = html;

      } catch (error) {
        console.error("Gagal memuat grup:", error);
        showSwal('error', 'Gagal', error.message);
      }
    }

    // 2. UPDATE: Edit Nama & Deadline Grup
    async function editGrup(groupId, currentNama, currentDeadline) {
      const { value: formValues } = await Swal.fire({
        title: `Edit Grup ${groupId}`,
        background: '#0f172a',
        color: '#f8fafc',
        html: `
          <div class="space-y-3 text-left">
            <div>
              <label class="text-xs text-slate-400">Nama Grup</label>
              <input id="swal-nama" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm text-slate-100" value="${currentNama}">
            </div>
            <div>
              <label class="text-xs text-slate-400">Deadline</label>
              <input type="date" id="swal-deadline" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm text-slate-100" value="${currentDeadline !== '-' ? currentDeadline : ''}">
            </div>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonColor: '#6366f1',
        cancelButtonColor: '#64748b',
        preConfirm: () => {
          return {
            nama: document.getElementById('swal-nama').value.trim(),
            deadline: document.getElementById('swal-deadline').value
          }
        }
      });

      if (formValues) {
        if (!formValues.nama) {
          showSwal('warning', 'Perhatian', 'Nama grup tidak boleh kosong');
          return;
        }

        try {
          const { doc, updateDoc } = window.firestoreApi;
          await updateDoc(doc(window.db, "aknend_groups", groupId), {
            nama_grup: formValues.nama,
            deadline: formValues.deadline || "-"
          });

          showSwal('success', 'Berhasil', 'Data grup diperbarui.');
          loadAllGroups();
        } catch (error) {
          showSwal('error', 'Gagal', error.message);
        }
      }
    }

    // 3. DELETE (Cascading Delete): Hapus Master Group + group_members + 30 juz_status
    async function hapusGrupBesertaChild(groupId, namaGrup) {
	  const confirmRes = await Swal.fire({
		title: `Hapus Permanen ${groupId}?`,
		text: `Grup "${namaGrup}" beserta seluruh anggota & status 30 juz di dalamnya akan dihapus bersih dari Firestore!`,
		icon: 'warning',
		showCancelButton: true,
		confirmButtonColor: '#ef4444',
		cancelButtonColor: '#64748b',
		confirmButtonText: 'Ya, Hapus Semua!',
		cancelButtonText: 'Batal',
		background: '#0f172a',
		color: '#f8fafc'
	  });

	  if (!confirmRes.isConfirmed) return;

	  try {
		const { doc, deleteDoc, collection, query, where, getDocs, writeBatch } = window.firestoreApi;
		
		// Inisialisasi batch DULU sebelum memasukkan perintah delete
		const batch = writeBatch(window.db);

		// A. Hapus Dokumen Utama di aknend_groups
		batch.delete(doc(window.db, "aknend_groups", groupId));

		// B. Cari & Tambahkan seluruh juz_status ke Batch Delete
		const qJuz = query(collection(window.db, "juz_status"), where("group_id", "==", groupId));
		const juzSnap = await getDocs(qJuz);
		juzSnap.forEach(d => batch.delete(d.ref));

		// C. Cari & Tambahkan seluruh group_members ke Batch Delete
		const qMembers = query(collection(window.db, "group_members"), where("group_id", "==", groupId));
		const membersSnap = await getDocs(qMembers);
		membersSnap.forEach(d => batch.delete(d.ref));

		// D. Cari & Tambahkan seluruh notifikasi (colekan) ke Batch Delete
		const qNotif = query(collection(window.db, "notifications"), where("group_id", "==", groupId));
		const notifSnap = await getDocs(qNotif);
		notifSnap.forEach(d => batch.delete(d.ref));

		// Eksekusi Hapus Masal (WriteBatch)
		await batch.commit();

		showSwal('success', 'Terhapus!', `Grup ${groupId} dan seluruh relasinya berhasil dibersihkan.`);
		loadAllGroups();

	  } catch (error) {
		console.error("Gagal menghapus grup:", error);
		showSwal('error', 'Gagal Hapus', error.message);
	  }
	}

  </script>
</body>
</html>
